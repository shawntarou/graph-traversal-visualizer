<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Graph Traversal Visualizer</title>
    <link href="styles.css" rel="stylesheet" />
    <script type="module" src="main.js" defer></script>
    <script
      src="https://kit.fontawesome.com/0a914059e1.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <header>
      <div class="header-left">
        <div class="selectors">
          <select id="speed-selector">
            <option value="fast">Fast</option>
            <option value="normal">Normal</option>
          </select>
          <select id="algo-selector">
            <option value="BFS">Breadth-First Search</option>
            <option value="DFS">Depth-First Search</option>
            <option value="dijkstra">Dijkstra's Algorithm</option>
          </select>
        </div>

        <button class="run-algo-button" title="Run Selected Algorithm">
          <i class="fa-solid fa-play"></i>
        </button>
        <button class="clear-button" title="Clear Graph">
          <i class="fa-solid fa-border-none"></i>
        </button>

        <button class="reset-button" title="Reset Graph">
          <i class="fa-solid fa-rotate-left"></i>
        </button>
      </div>
      <div class="header-right">
        <button class="add-weight-button" title="Add Weight">
          <i class="fa-solid fa-weight-hanging"></i>
        </button>
        <button class="select-start-button" title="Select New Start">
          <i class="fa-solid fa-bullseye"></i>
        </button>
        <button class="select-target-button" title="Select New Target">
          <i class="fa-solid fa-flag"></i>
        </button>
      </div>
    </header>
    <main>
      <div id="graph-container"></div>
    </main>
  </body>
</html>
