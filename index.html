<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Graph Traversal Visualizer</title>
    <link href="styles.css" rel="stylesheet" />
    <script type="module" src="main.js" defer></script>
  </head>
  <body>
    <main>
      <button class="reset-button">Reset</button>

      <select id="algo-selector">
        <option value="BFS">Breadth-First Search</option>
        <option value="DFS">Depth-First Search</option>
        <option value="dijkstra">Dijkstra's Algorithm</option>
      </select>

      <button class="run-algo-button">run algo</button>
      <button class="clear-button">clear</button>
      <button class="add-weight-button">add weight</button>
      <button class="select-start-button">select start</button>
      <button class="select-target-button">select target</button>
      <div id="graph-container"></div>
      <div id="selectable-graph-container"></div>
    </main>
  </body>
</html>
